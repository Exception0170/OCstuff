# LTDE core system settings

[system]
#: Text Editor | Default app opened by the edit command
text_editor=/ltde/apps/notepad.app

#: System File Check | Verify system files exist at startup
chksys=true

#: Memory Monitoring | Periodically check available RAM
memory_check=true

#: Memory Warning Threshold | Warn when free RAM drops below this (KB)
memory_warn_kb=24

#: Memory Critical Threshold | BSOD when free RAM drops below this (KB)
memory_critical_kb=8

#: Renderer FPS | Target frames per second for the UI renderer
renderer_fps=20

#: Log History | Archived session logs to keep (0 = keep all)
log_keep=10

[splash]
#: Startup Splash | Show loading screen during boot
enabled=true

#: Startup Pause | Seconds to hold the completed startup screen (0 disables pause)
delay=0.25
