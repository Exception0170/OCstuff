# Optional foreground colors. Unlisted types use the application's default.
# Values may be tgl colors16 names or RGB numbers such as 0xFFCC33.
[types]
#: Folders | Foreground color for directories.
directory=darkblue
#: Applications | Foreground color for .app entries.
app=gold

[extensions]
#: Lua | Foreground color for Lua files.
lua=darkgreen
#: TMG | Foreground color for TMG images.
tmg=purple
